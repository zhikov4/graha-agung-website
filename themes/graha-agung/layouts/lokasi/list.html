{{ define "main" }}

<section class="section">
  <div class="container">

    <h1>Daftar Kota Properti</h1>

    <div class="row">

      {{ range where .Site.RegularPages "Section" "lokasi" }}

      <div class="col-md-4 mb-4">

        <div class="card h-100">

          <div class="card-body">

            <h5>{{ .Title }}</h5>

            <p>{{ .Summary }}</p>

            <a href="{{ .RelPermalink }}"
               class="btn btn-outline-primary">
               Lihat Properti
            </a>

          </div>

        </div>

      </div>

      {{ end }}

    </div>

  </div>
</section>

{{ end }}
